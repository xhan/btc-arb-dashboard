<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路径报警管理</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --border: #d7dde7;
      --text: #1f2937;
      --muted: #6b7280;
      --brand: #2563eb;
      --danger: #dc2626;
      --success: #059669;
      --shadow: rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    a { color: inherit; }
    button, input, select {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      padding: 6px 10px;
    }
    button.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    button.danger {
      color: var(--danger);
      border-color: rgba(220, 38, 38, 0.25);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      background: #fff;
    }
    .page-shell {
      min-height: 100vh;
      padding: 16px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }
    .page-header h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }
    .page-subtitle {
      color: var(--muted);
      font-size: 14px;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      background: #fff;
    }
    .page-grid {
      display: grid;
      grid-template-columns: minmax(420px, 468px) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 24px var(--shadow);
      padding: 14px;
    }
    .left-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 16px;
    }
    .panel-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .panel-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .panel-controls input[type="text"] {
      min-width: 0;
    }
    .panel-controls button,
    .panel-controls .inline-count {
      white-space: nowrap;
    }
    .panel-controls button {
      padding: 5px 9px;
      font-size: 12px;
    }
    .inline-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      justify-self: end;
    }
    .inline-hint, .status-message {
      color: var(--muted);
      font-size: 13px;
    }
    .status-message.error {
      color: var(--danger);
    }
    .status-message.success {
      color: var(--success);
    }
    .editor-duplicate-warning {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(220, 38, 38, 0.18);
      border-radius: 10px;
      background: rgba(220, 38, 38, 0.06);
    }
    .inline-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid rgba(220, 38, 38, 0.22);
      border-radius: 9px;
      padding: 6px 10px;
      background: #fff;
      color: var(--danger);
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-section-toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-section-headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .list-section-count {
      color: var(--muted);
      font-size: 12px;
    }
    .list-filter-input {
      width: 100%;
    }
    .list-bulk-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .list-bulk-actions button {
      padding: 5px 9px;
      font-size: 12px;
    }
    .alert-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      background: #fff;
    }
    .alert-item-shell {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .alert-item-shell input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 3px 0 0;
      flex: 0 0 auto;
    }
    .alert-item-body {
      min-width: 0;
      flex: 1 1 auto;
    }
    .alert-item-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .alert-item-title {
      margin: 0;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.3;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .alert-item-note {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .alert-item-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .alert-item-actions {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-end;
      flex: 0 0 auto;
      align-items: center;
    }
    .alert-item-actions button {
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 8px;
    }
    .alert-item-select {
      width: 18px;
      height: 18px;
      margin-top: 0;
      flex: 0 0 auto;
    }
    .alert-item-main {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .alert-item-route {
      min-width: 0;
      margin: 0;
    }
    .alert-item-route-lines {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .alert-item-route-line {
      font-size: 12px;
      line-height: 1.3;
      color: var(--text);
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .editor-grid {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(240px, 1fr) minmax(220px, 0.8fr);
      gap: 12px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 600;
    }
    .editor-pane {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      background: #fafafa;
      min-height: 200px;
    }
    .editor-pane-title {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .path-alert-search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      gap: 8px;
      align-items: center;
    }
    .path-alert-search-shell {
      position: relative;
    }
    #path-alert-search-input {
      height: 40px;
      padding: 0 12px;
    }
    #path-alert-add-leg-btn {
      min-height: 40px;
      font-weight: 700;
    }
    .path-alert-suggestions {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 20;
      display: none;
      background: rgba(252, 252, 252, 0.98);
      border: 1px solid rgba(15, 23, 42, 0.10);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
      overflow: hidden;
      max-height: 320px;
      overflow-y: auto;
    }
    .path-alert-suggestions.visible {
      display: block;
    }
    .path-alert-suggestion {
      width: 100%;
      border: none;
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      cursor: pointer;
      color: var(--text-main, var(--text));
    }
    .path-alert-suggestion:last-child {
      border-bottom: none;
    }
    .path-alert-suggestion:hover,
    .path-alert-suggestion.active {
      background: rgba(37, 99, 235, 0.08);
    }
    .path-alert-suggestion-label {
      display: block;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.35;
      margin-bottom: 3px;
    }
    .path-alert-suggestion-meta {
      display: block;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }
    .editor-settings-pane {
      align-self: start;
    }
    .type-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .type-tab.active {
      border-color: var(--brand);
      color: var(--brand);
      background: rgba(37, 99, 235, 0.08);
    }
    .candidate-list,
    .selected-legs,
    .rule-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 256px;
      overflow: auto;
    }
    .candidate-item,
    .selected-leg-item,
    .rule-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      background: #fff;
    }
    .candidate-item,
    .selected-leg-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .candidate-text,
    .selected-leg-text,
    .rule-item {
      font-size: 12px;
      line-height: 1.4;
    }
    .candidate-primary,
    .candidate-secondary,
    .summary-line {
      white-space: normal;
      word-break: break-word;
    }
    .candidate-secondary {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }
    .selected-leg-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .rule-item.active {
      border-color: var(--brand);
      background: rgba(37, 99, 235, 0.08);
      color: var(--brand);
    }
    .editor-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }
    .editor-actions-right {
      display: flex;
      gap: 10px;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 16px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fff;
    }
    .summary-box {
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .editor-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .editor-checkbox-row input {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: 0 0 auto;
    }
    .section-anchor {
      scroll-margin-top: 16px;
    }
    @media (max-width: 1100px) {
      .page-grid {
        grid-template-columns: 1fr;
      }
      .editor-grid {
        grid-template-columns: 1fr;
      }
      .page-header {
        flex-direction: column;
      }
    }
    @media (max-width: 720px) {
      .panel-controls {
        grid-template-columns: 1fr 1fr;
      }
      .panel-controls input[type="text"] {
        grid-column: 1 / -1;
      }
      .inline-count {
        grid-column: 1 / -1;
        justify-self: start;
      }
      .alert-item-head {
        flex-direction: column;
        align-items: stretch;
      }
      .alert-item-title,
      .alert-item-route,
      .alert-item-meta {
        max-width: 100%;
      }
      .alert-item-actions {
        flex-wrap: wrap;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div id="path-alerts-page" class="page-shell">
    <div class="page-header">
      <div>
        <h1>路径报警管理</h1>
        <div class="page-subtitle">这里只管理配置。实时收益、状态和实际报警执行，仍在主看板的路径报警窗口查看。</div>
      </div>
      <div class="page-actions">
        <button id="path-alerts-create-btn" class="primary" type="button">+ 新建路径报警</button>
        <a class="page-link" href="/" target="_blank" rel="noopener noreferrer">返回主看板</a>
      </div>
    </div>

    <div class="status-message" id="path-alerts-status"></div>

    <div class="page-grid">
      <div class="left-stack">
        <section class="panel">
          <div class="panel-head">
            <h2>规则列表</h2>
            <div class="inline-hint">保存后，请回主看板点击重新加载</div>
          </div>
          <div class="panel-controls">
            <input id="path-alerts-search-input" type="text" placeholder="搜索链名、代币、规则摘要">
            <button id="path-alerts-dismiss-selected-btn" type="button">标记并删除所选</button>
            <button id="path-alerts-delete-selected-btn" type="button">批量删除</button>
            <div id="path-alerts-selection-count" class="inline-count">已选 0 条</div>
          </div>
          <div id="path-alerts-list" class="alert-list"></div>
        </section>

        <section class="panel section-anchor" id="dismissed-section">
          <div class="panel-head">
            <h2>不需要路径</h2>
            <div class="inline-hint">标记后，后续全量导入会自动跳过</div>
          </div>
          <div class="panel-controls">
            <input id="path-alerts-dismissed-search-input" type="text" placeholder="搜索已忽略路径">
            <button id="path-alerts-dismissed-delete-selected-btn" type="button">批量删除</button>
            <div id="path-alerts-dismissed-selection-count" class="inline-count">已选 0 条</div>
          </div>
          <div id="path-alerts-dismissed-list" class="alert-list"></div>
        </section>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2 id="path-alerts-editor-title">新建路径报警</h2>
          <button id="path-alerts-close-editor-btn" type="button">关闭编辑</button>
        </div>
        <div id="path-alerts-editor"></div>
      </section>
    </div>
  </div>

  <script src="special-rule-alert-config-utils.js"></script>
  <script src="path-alert-utils.js"></script>
  <script src="quote-alert-config-utils.js"></script>
  <script src="path-alert-page-utils.js"></script>
  <script src="path-alert-rule-definitions.js"></script>
  <script src="quote-calculator.js"></script>
  <script src="quote-pause-utils.js"></script>
  <script src="path-alert-candidate-utils.js"></script>
  <script src="path-alerts-app.js"></script>
</body>
</html>
