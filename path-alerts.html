<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>路径报警管理</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --border: #d7dde7;
      --text: #1f2937;
      --muted: #6b7280;
      --brand: #2563eb;
      --danger: #dc2626;
      --success: #059669;
      --shadow: rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { color: inherit; }
    button, input, select {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      padding: 8px 12px;
    }
    button.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    button.danger {
      color: var(--danger);
      border-color: rgba(220, 38, 38, 0.25);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }
    .page-shell {
      min-height: 100vh;
      padding: 24px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }
    .page-header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    .page-subtitle {
      color: var(--muted);
      font-size: 14px;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      background: #fff;
    }
    .page-grid {
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(520px, 1fr);
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 24px var(--shadow);
      padding: 18px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 18px;
    }
    .inline-hint, .status-message {
      color: var(--muted);
      font-size: 13px;
    }
    .status-message.error {
      color: var(--danger);
    }
    .status-message.success {
      color: var(--success);
    }
    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .alert-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .alert-item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .alert-item-title {
      margin: 0 0 6px;
      font-weight: 700;
    }
    .alert-item-meta {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .alert-item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .editor-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr);
      gap: 16px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .editor-pane {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fafafa;
      min-height: 220px;
    }
    .type-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .type-tab.active {
      border-color: var(--brand);
      color: var(--brand);
      background: rgba(37, 99, 235, 0.08);
    }
    .candidate-list,
    .selected-legs,
    .rule-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow: auto;
    }
    .candidate-item,
    .selected-leg-item,
    .rule-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
    }
    .candidate-item,
    .selected-leg-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .candidate-text,
    .selected-leg-text,
    .rule-item {
      font-size: 13px;
      line-height: 1.45;
    }
    .selected-leg-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .rule-item.active {
      border-color: var(--brand);
      background: rgba(37, 99, 235, 0.08);
      color: var(--brand);
    }
    .editor-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 18px;
    }
    .editor-actions-right {
      display: flex;
      gap: 10px;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 16px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fff;
    }
    .summary-box {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    @media (max-width: 1100px) {
      .page-grid {
        grid-template-columns: 1fr;
      }
      .editor-grid {
        grid-template-columns: 1fr;
      }
      .page-header {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="path-alerts-page" class="page-shell">
    <div class="page-header">
      <div>
        <h1>路径报警管理</h1>
        <div class="page-subtitle">这里只管理配置。实时收益、状态和实际报警执行，仍在主看板的路径报警窗口查看。</div>
      </div>
      <div class="page-actions">
        <button id="path-alerts-create-btn" class="primary" type="button">+ 新建路径报警</button>
        <a class="page-link" href="/" target="_blank" rel="noopener noreferrer">返回主看板</a>
      </div>
    </div>

    <div class="status-message" id="path-alerts-status"></div>

    <div class="page-grid">
      <section class="panel">
        <div class="panel-head">
          <h2>规则列表</h2>
          <div class="inline-hint">保存后，请回主看板点击重新加载</div>
        </div>
        <div id="path-alerts-list" class="alert-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="path-alerts-editor-title">新建路径报警</h2>
          <button id="path-alerts-close-editor-btn" type="button">关闭编辑</button>
        </div>
        <div id="path-alerts-editor"></div>
      </section>
    </div>
  </div>

  <script src="path-alert-utils.js"></script>
  <script src="path-alert-page-utils.js"></script>
  <script src="path-alert-rule-definitions.js"></script>
  <script src="path-alerts-app.js"></script>
</body>
</html>
